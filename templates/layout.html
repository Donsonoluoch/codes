<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Student MIS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
 <!-- Tailwind via CDN for quick prototyping -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .custom-success {
    display: flex;
    align-items: center;
    gap: 8px; /* space between tick and text */
}

.tick-icon::before {
    content: "\2714"; /* Unicode checkmark */
    color: #28a745;   /* Bootstrap green or your brand green */
    font-weight: bold;
    font-size: 1.2em;
}

  </style>
</head>
<body>
  <nav>
    <!-- show login/register or logout/profile based on current_user -->
  </nav>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}
    
    {% endblock %}
  </main>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
