{# templates/student/resume_studies.html #}
{% extends 'layout.html' %}
{% block title %}Resume Studies{% endblock %}

{% block content %}
  <div class="max-w-md mx-auto bg-white p-6 rounded-lg shadow">
    <h2 class="text-2xl font-semibold mb-4">Resume Your Studies</h2>
    <p>Are you sure you want to resume your active student status?</p>
    <form method="post" class="mt-4">
      <button type="submit"
              class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700">
        Yes, Resume Now
      </button>
      <a href="{{ url_for('student.deferred_notice') }}"
         class="ml-4 text-gray-600 hover:underline">
        Cancel
      </a>
    </form>
  </div>
{% endblock %}
