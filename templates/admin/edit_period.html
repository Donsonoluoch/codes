{% extends 'layout.html' %}
{% block title %}
  {{ period.id and 'Edit' or 'Add' }} Reporting Period
{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto p-6 bg-white shadow-md rounded-lg">
  <h2 class="text-2xl font-semibold text-gray-800 mb-6">
    {{ period.id and 'Edit' or 'Add' }} Reporting Period
  </h2>

  <form method="post" class="space-y-6">
    <!-- Name -->
    <div>
      <label for="name" class="block text-gray-700 font-medium mb-1">
        Period Name
      </label>
      <input
        type="text"
        id="name"
        name="name"
        value="{{ period.name or '' }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="e.g. Fall 2025 Kickoff"
      >
    </div>

    <!-- Start Date -->
    <div>
      <label for="start_date" class="block text-gray-700 font-medium mb-1">
        Start Date
      </label>
      <input
        type="date"
        id="start_date"
        name="start_date"
        value="{{ period.start_date or '' }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <!-- End Date -->
    <div>
      <label for="end_date" class="block text-gray-700 font-medium mb-1">
        End Date
      </label>
      <input
        type="date"
        id="end_date"
        name="end_date"
        value="{{ period.end_date or '' }}"
        required
        class="w-full px-4 py-2 border border-gray-300 rounded-lg
               focus:outline-none focus:ring-2 focus:ring-blue-500"
      >
    </div>

    <!-- Active Toggle -->
    <div class="flex items-center space-x-3">
      <input
        type="checkbox"
        id="active"
        name="active"
        class="h-5 w-5 text-blue-600 rounded focus:ring-2 focus:ring-blue-500"
        {% if period.active %}checked{% endif %}
      >
      <label for="active" class="text-gray-700 font-medium">
        Active
      </label>
    </div>

    <!-- Buttons -->
    <div class="flex justify-end space-x-4">
      <a href="{{ url_for('admin.list_periods') }}"
         class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">
        Cancel
      </a>
      <button
        type="submit"
        class="px-6 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
        Save
      </button>
    </div>
  </form>
</div>
{% endblock %}
