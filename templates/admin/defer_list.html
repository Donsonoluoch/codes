{% extends 'layout.html' %}
{% block content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <h2 class="text-2xl font-semibold text-gray-800 mb-6">All Deferment Requests</h2>

  <div class="overflow-x-auto bg-white shadow rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Student
          </th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
            Submitted
          </th>
          <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
            Action
          </th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        {% for dr in drequests %}
          <tr class="hover:bg-gray-50">
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
              {{ dr.student.name }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-700">
              {{ dr.submitted_at.strftime('%Y-%m-%d') }}
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-center text-sm">
              <a href="{{ url_for('admin.review_deferment', rid=dr.id) }}"
                 class="inline-flex items-center px-3 py-1 bg-blue-100 text-blue-700 text-sm font-medium rounded hover:bg-blue-200 transition">
                Review
              </a>
            </td>
          </tr>
        {% else %}
          <tr>
            <td colspan="3" class="px-6 py-4 whitespace-nowrap text-center text-sm text-gray-500">
              No requests found.
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
```
