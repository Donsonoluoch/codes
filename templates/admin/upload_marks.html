{% extends 'layout.html' %}

{% block content %}
<div class="max-w-4xl mx-auto py-8">
  <h1 class="text-2xl font-semibold mb-6">Upload Marks</h1>

  <form method="POST" action="{{ url_for('admin.upload_marks') }}" class="space-y-6">
   

    <div class="overflow-x-auto">
      <table class="min-w-full bg-white shadow rounded-lg">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Semester</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Course</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Student</th>
            <th class="px-4 py-2 text-left text-sm font-medium text-gray-700">Score</th>
            <th class="px-4 py-2"></th>
          </tr>
        </thead>
        <tbody id="marks-table-body">
          <tr>
            <td class="border-t px-4 py-2">
              <select name="semester_id" required
                      class="w-full border-gray-300 rounded-md">
                <option value="" disabled selected>Choose...</option>
                {% for sem in semesters %}
                  <option value="{{ sem.id }}">{{ sem.name }}</option>
                {% endfor %}
              </select>
            </td>
            <td class="border-t px-4 py-2">
              <select name="course_id" required
                      class="w-full border-gray-300 rounded-md">
                <option value="" disabled selected>Choose...</option>
                {% for course in courses %}
                  <option value="{{ course.id }}">{{ course.code }} – {{ course.title }}</option>
                {% endfor %}
              </select>
            </td>
            <td class="border-t px-4 py-2">
              <select name="student_id" required
                      class="w-full border-gray-300 rounded-md">
                <option value="" disabled selected>Choose...</option>
                {% for student in students %}
                  <option value="{{ student.id }}">{{ student.full_name }}</option>
                {% endfor %}
              </select>
            </td>
            <td class="border-t px-4 py-2">
              <input name="score" type="number" step="0.01" min="0" required
                     class="w-full border-gray-300 rounded-md" />
            </td>
            <td class="border-t px-4 py-2 text-center">
              <button type="button"
                      onclick="removeRow(this)"
                      class="text-red-500 hover:text-red-700">
                &times;
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="flex items-center space-x-4">
      <button type="button" onclick="addRow()"
              class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded">
        + Add Row
      </button>
      <button type="submit"
              class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded">
        Upload Marks
      </button>
    </div>
  </form>
</div>

<script>
// Clone the first row, clear its inputs, and append to table body
function addRow() {
  const tbody = document.getElementById('marks-table-body');
  const firstRow = tbody.querySelector('tr');
  const newRow = firstRow.cloneNode(true);

  // Reset selects and inputs
  newRow.querySelectorAll('select').forEach(s => s.selectedIndex = 0);
  newRow.querySelector('input').value = '';

  tbody.appendChild(newRow);
}

// Remove a row, but keep at least one
function removeRow(btn) {
  const tbody = document.getElementById('marks-table-body');
  if (tbody.rows.length > 1) {
    btn.closest('tr').remove();
  }
}
</script>
{% endblock %}
