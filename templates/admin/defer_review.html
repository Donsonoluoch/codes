{% extends 'layout.html' %}
{% block title %}Review Deferment{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
  <h2 class="text-2xl font-semibold mb-4">Review Deferment</h2>

  <p class="mb-2"><strong>Student:</strong> {{ dr.student.user.name }}</p>
  <p class="mb-4"><strong>Submitted:</strong> {{ dr.submitted_at }}</p>

  <div class="mb-6">
    <strong>Evidence Files:</strong>
    <ul class="list-disc list-inside mt-2">
      {% for f in dr.evidence_files %}
      <li>
        <a
          href="{{ url_for('static', filename='uploads/deferment/' ~ dr.id ~ '/' ~ f.filename) }}"
          class="text-blue-600 hover:underline"
          target="_blank"
        >
          {{ f.original_name }}
        </a>
      </li>
      {% endfor %}
    </ul>
  </div>

  <form method="post" class="space-y-4">
    <div>
      <label for="admin_notes" class="block text-gray-700 font-medium mb-1">
        Admin Notes (optional)
      </label>
      <textarea
        id="admin_notes"
        name="admin_notes"
        rows="4"
        class="w-full px-3 py-2 border rounded focus:ring-2 focus:ring-blue-500"
      >{{ dr.admin_notes or '' }}</textarea>
    </div>

    <div class="flex space-x-4">
      <button
        name="decision" value="approved"
        class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 transition"
      >
        Approve
      </button>
      <button
        name="decision" value="declined"
        class="bg-red-600 text-white px-4 py-2 rounded hover:bg-red-700 transition"
      >
        Decline
      </button>
    </div>
  </form>
</div>
{% endblock %}
